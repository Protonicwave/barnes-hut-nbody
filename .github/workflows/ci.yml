name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --workflow --preset dev
      - run: cmake --workflow --preset release
      - run: python3 -m unittest discover -s bench -p "test_*.py"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install ".[test,plot]"
      - run: .venv/bin/python -m pytest -q

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMSDK_VERSION: 6.0.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$(dirname "$(echo "$HOME"/emsdk/node/*/bin/node)")" >> "$GITHUB_PATH"
      - run: cmake --workflow --preset wasm-threads
      - run: cmake --workflow --preset wasm-single
      - run: node --test web/test/smoke.mjs
      - name: Check isolation headers on local servers
        run: |
          python3 web/serve.py --port 8000 &
          python3 web/serve.py --port 8001 --no-isolation &
          shellcheck scripts/check_site_headers.sh
          bash scripts/check_site_headers.sh http://127.0.0.1:8000
          # The second server sends no isolation headers, so the check must fail
          # on them, not merely because nothing answered.
          status=0
          output=$(bash scripts/check_site_headers.sh http://127.0.0.1:8001) || status=$?
          echo "$output"
          test "$status" -eq 1
          grep -q "Cross-Origin-Opener-Policy: expected" <<< "$output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: wasm-modules
          path: web/wasm/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: wasm
    if: github.event_name == 'push' && github.repository == 'Protonicwave/barnes-hut-nbody'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      WRANGLER_VERSION: 4.158.0
      WRANGLER_SEND_METRICS: "false"
      SITE_URL: https://barnes-hut-nbody.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A newer push has its own run, and deploying this older build after it
      # would put stale files live.
      - name: Check this commit is still the head of main
        id: head
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$remote_head" || { echo "::error::could not read the head of main"; exit 1; }
          if [ "$remote_head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $remote_head, skipping the deploy"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: wasm-modules
          path: web/wasm/
      - name: Assemble the site
        if: steps.head.outputs.current == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          mkdir "$site"
          tar -C web --exclude='*.py' --exclude=test --exclude=__pycache__ -cf - . | tar -C "$site" -xf -
          for required in _headers index.html worker.js wasm/threads/nbody.js wasm/threads/nbody.wasm \
            wasm/single/nbody.js wasm/single/nbody.wasm; do
            test -f "$site/$required" || { echo "::error::missing $required"; exit 1; }
          done
      - name: Deploy to Cloudflare Pages
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@"$WRANGLER_VERSION" pages deploy "$RUNNER_TEMP/site" \
            --project-name=barnes-hut-nbody --branch=main --commit-hash="$GITHUB_SHA"
      - name: Check the live headers
        if: steps.head.outputs.current == 'true'
        run: bash scripts/check_site_headers.sh "$SITE_URL"

  sanitisers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --workflow --preset asan

  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=1 ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang libomp-dev
      # libgomp is not instrumented for the thread sanitiser and reports races
      # that are not there. LLVM's OpenMP runtime is, through the Archer tool.
      - run: echo "OMP_TOOL_LIBRARIES=$(find /usr/lib/llvm-*/lib -name libarcher.so | head -n 1)" >> "$GITHUB_ENV"
      - run: |
          echo "OMP_TOOL_LIBRARIES=$OMP_TOOL_LIBRARIES"
          cmake --preset tsan
          cmake --build --preset tsan
          ctest --test-dir build/tsan --output-on-failure

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install ninja libomp
      - run: echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - run: cmake --workflow --preset dev

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test with MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cmake --workflow --preset msvc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
