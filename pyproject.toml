[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "barnes-hut-nbody"
version = "0.1.0"
description = "Barnes-Hut gravitational N-body simulation with OpenMP parallel force loops."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Source = "https://github.com/Protonicwave/barnes-hut-nbody"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
wheel.packages = ["python/barnes_hut"]
sdist.include = ["python", "include", "src", "CMakeLists.txt", "LICENSE", "README.md"]
sdist.exclude = [
    ".github",
    ".pytest_cache",
    "**/__pycache__",
    "bench",
    "build",
    "results",
    "tests",
    "scripts",
]

[tool.scikit-build.cmake.define]
NBODY_BUILD_PYTHON = "ON"
BUILD_TESTING = "OFF"
OpenMP_RUNTIME_MSVC = "llvm"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["barnes_hut"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["python"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-extras = ["test"]
test-command = "pytest {project}/python/tests -q"
build-verbosity = 1

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", OpenMP_ROOT = "/opt/homebrew/opt/libomp" }
