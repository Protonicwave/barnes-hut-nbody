<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Scope draw time</title>
<style>
  :root {
    --view-bg: oklch(0.15 0.03 262); --view-ink: oklch(0.93 0.015 250); --view-dim: oklch(0.7 0.02 255);
    --view-grid: oklch(0.3 0.04 262); --view-axis: oklch(0.46 0.04 262); --view-tree: oklch(0.8 0.14 78);
  }
  body { margin: 0; background: #fff; }
  #glass { position: relative; width: 960px; height: 660px; background: var(--view-bg); }
  #glass canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="glass"><canvas id="graticule"></canvas><canvas id="particles"></canvas><canvas id="view"></canvas></div>
<script type="module">
// Draws one 8,192 particle Plummer frame from the single-threaded build, with
// the octree cells in view and a tree walk, many times and reports the median time of one Viewport.draw. page_budget.mjs
// reads window.benchResult.
import { Runner } from "../runner.js";
import { defaultMarkedParticle } from "../scope.js";
import { DEFAULT_SETTINGS } from "../settings.js";
import { Viewport } from "../viewport.js";
import createModule from "../wasm/single/nbody.js";

const DRAWS = 200;
const WARM_UP_DRAWS = 20;
const LARGEST_COUNT_INDEX = 5;
const SETTLE_STEPS = 8;
(async () => {
  const module = await createModule();
  const settings = { ...DEFAULT_SETTINGS, countIndex: LARGEST_COUNT_INDEX, threads: 1 };
  const runner = new Runner(module, settings);
  const first = runner.frame({ steps: SETTLE_STEPS, budgetMs: 10000, probe: -1, wantCells: false }).message;
  const mark = defaultMarkedParticle(first.positions, settings.setup);
  const { message } = runner.frame({ steps: 1, budgetMs: 10000, probe: mark, wantCells: true });

  const viewport = new Viewport(
    { graticule: document.getElementById("graticule"), particles: document.getElementById("particles"), overlay: document.getElementById("view") },
    { persistence: true });
  viewport.setup("plummer");
  viewport.fit();
  const frame = {
    positions: message.positions,
    bands: message.bands,
    stepped: true,
    mark,
    cells: message.cells,
    probe: message.probe,
    trails: [],
    showCells: true,
  };
  const times = [];
  for (let draw = 0; draw < WARM_UP_DRAWS + DRAWS; draw++) {
    const start = performance.now();
    viewport.draw(frame);
    if (draw >= WARM_UP_DRAWS) {
      times.push(performance.now() - start);
    }
  }
  times.sort((a, b) => a - b);
  runner.close();
  window.benchResult = { count: message.count, ratio: window.devicePixelRatio, medianMs: times[times.length >> 1] };
})().catch((error) => { window.benchResult = { error: String(error) }; });
</script>
</body>
</html>
